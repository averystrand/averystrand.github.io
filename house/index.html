<style>
:root{--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--accent:#2a78d6;--border:rgba(11,11,11,.12);--err:#d03b3b}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.gate{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px 26px;width:min(380px,100%)}

p{color:var(--ink2);font-size:13px;margin:0 0 16px}
input{width:100%;box-sizing:border-box;padding:10px 12px;font:inherit;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink)}
button{margin-top:10px;width:100%;padding:10px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
</style>
